# cargo-deny config. CI runs `cargo deny check` through cargo-deny-action.
# Full reference: `cargo deny init` writes every option with comments.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason:
# { id = "RUSTSEC-0000-0000", reason = "..." }
ignore = []

[licenses]
# Permissive licenses only. Add one when a dependency needs it and the
# license is acceptable for this project.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
# The list covers common crates; most projects use only some of them.
unused-allowed-license = "allow"

[licenses.private]
# Crates with `publish = false` in Cargo.toml need no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
